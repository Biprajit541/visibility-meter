services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meter
      POSTGRES_PASSWORD: meter
      POSTGRES_DB: meter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meter"]
      interval: 3s
      retries: 10
    ports: ["5432:5432"]
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://meter:meter@db:5432/meter
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
